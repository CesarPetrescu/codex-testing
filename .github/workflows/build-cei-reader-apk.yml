name: Build CEI Reader APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Reassemble and patch source archive
        shell: bash
        run: |
          set -euo pipefail
          cat ci/parts/part-* > cei-reader-android.zip.b64
          base64 --decode cei-reader-android.zip.b64 > cei-reader-android.zip
          echo "f454d173762e0ab03ed60d50455ae4d95c5b6e59d428401d18cda3aa2a76b678  cei-reader-android.zip" | sha256sum --check --strict
          unzip -q cei-reader-android.zip -d build-src

          python3 - <<'PY'
          from pathlib import Path
          path = Path("build-src/cei-reader-android/app/src/main/res/values/themes.xml")
          text = path.read_text()
          old = '<style name="ShapeAppearanceOverlay.CEIReader.Portrait">'
          new = '<style name="ShapeAppearanceOverlay.CEIReader.Portrait" parent="">'
          if old not in text:
              raise SystemExit("Expected CEI portrait style declaration was not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"

          if [[ ! -d "$SDK_ROOT/platforms/android-36" || ! -d "$SDK_ROOT/build-tools/36.0.0" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$SDKMANAGER" ]]; then
              SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
            fi
            test -x "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          fi

          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt2"

      - name: Build debug APK
        id: gradle_build
        continue-on-error: true
        working-directory: build-src/cei-reader-android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ro-cei-reader-gradle-log
          path: build-src/cei-reader-android/gradle-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after failed compilation
        if: steps.gradle_build.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Verify APK
        working-directory: build-src/cei-reader-android
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$SDK_ROOT/build-tools/36.0.0/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/badging.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RO-CEI-Reader-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ro-cei-reader-debug-apk
          path: |
            build-src/cei-reader-android/app/build/outputs/apk/debug/RO-CEI-Reader-debug.apk
            build-src/cei-reader-android/app/build/outputs/apk/debug/SHA256SUMS
            build-src/cei-reader-android/app/build/outputs/apk/debug/badging.txt
          if-no-files-found: error
          retention-days: 1
