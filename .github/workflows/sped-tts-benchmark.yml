name: SpeD Romanian TTS benchmark

on:
  push:
    branches:
      - tmp-sped-tts-benchmark-20260810
    paths:
      - sped_tts_benchmark.py
      - .github/workflows/sped-tts-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "onnx-asr[cpu,hub]" \
            edge-tts \
            gTTS \
            "huggingface_hub>=0.34" \
            hf_xet \
            jiwer \
            piper-tts \
            soundfile

      - name: Run benchmark
        shell: bash
        run: |
          set -o pipefail
          python sped_tts_benchmark.py 2>&1 | tee benchmark.log

      - name: Upload report, metrics, transcripts, and audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sped-romanian-tts-benchmark
          path: |
            benchmark_artifact
            benchmark.log
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
